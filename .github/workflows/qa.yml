name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    uses: nlemoine/.github/.github/workflows/php-qa.yml@d6574f76ad2cc59d03db7a24a3ce7f093c6df86a
    with:
      cs-tool: ecs
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
