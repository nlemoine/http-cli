name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    uses: nlemoine/.github/.github/workflows/php-qa.yml@05f8fcca48f4ccf8bfccf8cb603c88e0ec8779f7
    with:
      cs-tool: ecs
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
