name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    uses: nlemoine/.github/.github/workflows/php-qa.yml@95f5a1b6345fa233decd344a1d1bd451c617ba90
    with:
      cs-tool: ecs
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
